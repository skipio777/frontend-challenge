<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Stats preview card component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <main>
      <div class="card-banner">
        <picture class="card-picture">
          <source
            media="(min-width: 1192px)"
            srcset="./images/image-header-desktop.jpg"
          />
          <img
            class="card-image"
            src="./images/image-header-mobile.jpg"
            alt=""
          />
        </picture>
      </div>

      <div class="card-content">
        <div class="card-description">
          <h1 class="card-description-main">
            Get <span class="card-description-accent">insights</span> that help
            your business grow.
          </h1>
          <p class="card-description-sub">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
        </div>
        <ul class="card-states">
          <li class="card-states-session">
            <p class="card-states-session-number">10k+</p>
            <p class="card-states-session-subject">companies</p>
          </li>
          <li class="card-states-session">
            <p class="card-states-session-number">314</p>
            <p class="card-states-session-subject">templates</p>
          </li>
          <li class="card-states-session">
            <p class="card-states-session-number">12M+</p>
            <p class="card-states-session-subject">queries</p>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
